<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cadastro de Orçamentos</title>
    
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3f37c9;
            --success: #2a9d8f;
            --danger: #e63946;
            --warning: #fca311;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2b2d42;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .navbar {
            width: 100%;
            background-color: var(--primary);
            padding: 15px 0;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            display: block;
        }
        .navbar a {
            color: white !important;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
            font-size: 18px;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background 0.3s;
            display: inline-block;
        }
        .navbar a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        h1, h2 { color: var(--text); margin-bottom: 20px; text-align: center; }
        
        form {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #e9ecef;
        }
        form label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 600; color: #555; }
        form input, form select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #ced4da; box-sizing: border-box; }
        form input:focus, form select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15); }
        
        form button {
            width: 100%; padding: 12px; margin-top: 25px; border: none; background-color: var(--primary); color: white; border-radius: 6px; cursor: pointer; font-weight: bold; transition: transform 0.1s;
        }
        form button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        
        .radio-group { margin: 15px 0; padding: 15px; background: #f1f3f5; border-radius: 8px; display: flex; justify-content: center; gap: 20px; border: 1px solid #e9ecef; }
        .radio-group label { margin: 0; cursor: pointer; font-weight: normal; display: flex; align-items: center; }
        .radio-group input { width: auto; margin-right: 5px; }

        .search-container { background-color: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 6px; margin-top: 15px; }
        #searchButtonCliente, #searchButtonUsuario { background-color: var(--primary); margin-top: 10px; }
        
        .supplier-result { background: white; padding: 10px; border: 1px solid #ddd; margin-top: 5px; cursor: pointer; border-radius: 4px; }
        .supplier-result:hover { background-color: #e2e6ea; border-color: var(--primary); }
        
        #selectedSupplierName { margin-top: 15px; padding: 12px; background-color: #e6fffa; color: #006d5b; border: 1px solid #2a9d8f; border-radius: 6px; font-weight: bold; text-align: center; }

        .table-container { width: 90%; max-width: 1000px; }
        table { width: 100%; border-collapse: collapse; background: var(--card-bg); box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden; }
        th { background-color: var(--bg-color); color: var(--text); font-weight: 700; padding: 15px; text-align: left; border-bottom: 2px solid #ddd; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; color: #444; }
        tr:nth-child(even) { background-color: #fcfcfc; }
        tr:hover { background-color: #f1f3f5; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/usuarios/pesquisa">Gerenciar Usuários</a>
        <a href="/clientes">Gerenciar Clientes</a>
        <a href="/orcamentos">Novo Orçamento</a>
    </nav>

    <h1>Cadastrar Orçamento</h1>
    
    <form th:action="@{/orcamentos}" th:object="${orcamentoModel}" method="post">
        
        <label>Valor do Orçamento:</label>
        <input type="number" step="0.01" th:field="*{valorOrcamento}" required />

        <label>Data do Orçamento:</label>
        <input type="date" th:field="*{dataCadastro}" required />

        <label>Estado (ICMS):</label>
        <select th:field="*{icmsEstados}" required>
            <option value="ICMS_MG">Minas Gerais (MG)</option>
            <option value="ICMS_SP">São Paulo (SP)</option>
            <option value="ICMS_RJ">Rio de Janeiro (RJ)</option>
        </select>
        
        <hr>

        <div class="radio-group">
            <label style="font-weight: bold; margin-right: 10px;">Dono:</label>
            <label><input type="radio" name="tipoDono" value="cliente" checked> Cliente</label>
            <label><input type="radio" name="tipoDono" value="usuario"> Usuário</label>
        </div>

        <div id="searchClienteContainer" class="search-container">
            <label>Pesquisar Cliente (Nome/CPF):</label>
            <input type="text" id="searchTermCliente" placeholder="Digite...">
            <button type="button" id="searchButtonCliente">Pesquisar</button>
            <div id="supplierSearchResultsCliente"></div>
            <input type="hidden" id="clienteId" name="clienteId" />
        </div>

        <div id="searchUsuarioContainer" class="search-container" style="display:none;">
            <label>Pesquisar Usuário (Nome):</label>
            <input type="text" id="searchTermUsuario" placeholder="Digite...">
            <button type="button" id="searchButtonUsuario">Pesquisar</button>
            <div id="supplierSearchResultsUsuario"></div>
            <input type="hidden" id="usuarioId" name="usuarioId" />
        </div>

        <div id="selectedSupplierName"></div>
        
        <button type="submit">Salvar Orçamento</button>
    </form>


    <div class="table-container">
        <h2>Orçamentos Cadastrados</h2>
        
        <div th:if="${orcamentos != null and not #lists.isEmpty(orcamentos)}">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Valor</th>
                        <th>ICMS</th>
                        <th>Data</th>
                        <th>Dono (Cliente/Usuário)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="orc : ${orcamentos}">
                        <td th:text="${orc.id}"></td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(orc.valorOrcamento, 1, 2, 'COMMA')}"></td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(orc.valorICMS, 1, 2, 'COMMA')}"></td>
                        <td th:text="${orc.dataCadastro != null ? #temporals.format(orc.dataCadastro, 'dd/MM/yyyy') : '-'}"></td>
                        
                        <td>
                            <span th:if="${orc.cliente != null}" th:text="${orc.cliente.nome} + ' (Cliente)'" style="color: var(--success); font-weight: bold;"></span>
                            <span th:if="${orc.usuario != null}" th:text="${orc.usuario.nomeUsuario} + ' (Usuário)'" style="color: var(--primary); font-weight: bold;"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <p th:if="${orcamentos == null or #lists.isEmpty(orcamentos)}" style="text-align: center; color: #666;">
            Nenhum orçamento cadastrado ainda.
        </p>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            
            $('input[type=radio][name=tipoDono]').change(function() {
                if (this.value == 'cliente') {
                    $('#searchClienteContainer').show();
                    $('#searchUsuarioContainer').hide();
                } else {
                    $('#searchClienteContainer').hide();
                    $('#searchUsuarioContainer').show();
                }
                $('#supplierSearchResultsCliente, #supplierSearchResultsUsuario').empty();
                $('#selectedSupplierName').empty();
                $('#clienteId, #usuarioId').val('');
            });

            $('#searchButtonCliente').click(function() {
                var term = $('#searchTermCliente').val(); 
                $.get('/clientes/search', { termo: term }, function(data) {
                    var html = "";
                    $.each(data, function(i, item) {
                        html += '<div class="supplier-result cliente" data-id="' + item.id + '" data-name="' + item.nome + '">' 
                              + item.nome + ' (CPF: ' + item.cpf + ')</div>';
                    });
                    $('#supplierSearchResultsCliente').html(html);
                });
            });

            $('#searchButtonUsuario').click(function() {
                var term = $('#searchTermUsuario').val(); 
                $.get('/usuarios/search', { nome: term }, function(data) {
                    var html = "";
                    $.each(data, function(i, item) {
                        html += '<div class="supplier-result usuario" data-id="' + item.id + '" data-name="' + item.nomeUsuario + '">' 
                              + item.nomeUsuario + ' (RG: ' + item.rg + ')</div>';
                    });
                    $('#supplierSearchResultsUsuario').html(html);
                });
            });

            $(document).on('click', '.supplier-result', function() {
                var id = $(this).data('id'); 
                var name = $(this).data('name');
                
                $('#clienteId, #usuarioId').val(''); 
                
                if ($(this).hasClass('cliente')) {
                    $('#clienteId').val(id);
                    $('#selectedSupplierName').text('Cliente Selecionado: ' + name).css('color', '#2a9d8f');
                    $('#supplierSearchResultsCliente').empty();
                } else {
                    $('#usuarioId').val(id);
                    $('#selectedSupplierName').text('Usuário Selecionado: ' + name).css('color', '#4361ee');
                    $('#supplierSearchResultsUsuario').empty();
                }
            });
        });
    </script>
</body>
</html>
